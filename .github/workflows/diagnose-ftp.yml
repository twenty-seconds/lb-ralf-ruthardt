name: Diagnose ruthardt.de webroot

on:
  workflow_dispatch:

jobs:
  find-webroot:
    runs-on: ubuntu-latest
    steps:
      - name: Typische Webroot-Pfade gezielt prüfen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python - <<'PY'
          import ftplib, io, os

          ftp = ftplib.FTP_TLS(os.environ['FTP_HOST'])
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          ftp.prot_p()
          marker = b'Das laute Schweigen: Wenn die Meinung verstummt'
          matches = []

          candidates = ['/magazin.html']
          try:
              for name, facts in ftp.mlsd('/'):
                  if facts.get('type') == 'dir' and name not in ('.', '..'):
                      candidates.append('/' + name.strip('/') + '/magazin.html')
          except ftplib.all_errors:
              pass

          for candidate in candidates:
              data = io.BytesIO()
              try:
                  ftp.retrbinary('RETR ' + candidate, data.write)
                  if marker in data.getvalue():
                      matches.append(candidate.rsplit('/', 1)[0] + '/')
              except ftplib.all_errors:
                  pass
          for match in matches:
              print('WEBROOT_MATCH=' + match)
          ftp.quit()
          raise SystemExit(0 if matches else 1)
          PY
